<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Merge Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Saira+Stencil+One&display=swap"
    />
    <style>
      /* One committed look: the olive command tent around a sunlit sand board. */
      :root {
        --tent: #2f3a25;
        --sand: #d8c79c;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--tent);
        overscroll-behavior: none;
      }
      #game {
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
